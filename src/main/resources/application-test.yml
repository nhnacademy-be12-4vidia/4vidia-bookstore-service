spring:
  config:
    activate:
      on-profile: test

  # 외부 설정 로드 방지
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    # 500 LazyInit 에러 해결
    open-in-view: true

  data:
    elasticsearch:
      repositories:
        enabled: false
    redis:
      repositories:
        enabled: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false
    host: localhost
    port: 5672
    username: guest
    password: guest

  elasticsearch:
    uris: http://localhost:9200
    socket-timeout: 10s
    connection-timeout: 1s

  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

redis:
  cart:
    host: localhost
    port: 6379
    password: ""
    database: 0
  dormant:
    host: localhost
    port: 6379
    password: ""
    database: 1
  bestseller:
    host: localhost
    port: 6379
    password: ""
    database: 2
  ai:
    host: localhost
    port: 6379
    password: ""
    database: 3

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

cloud:
  aws:
    s3:
      endpoint: http://localhost:8001
      bucket: test-bucket
    credentials:
      access-key: test
      secret-key: test
    region:
      static: us-east-1
    stack:
      auto: false

image:
  default:
    thumbnail: http://localhost/images/default.png

toss:
  secretKey: test_key
name: 4vidia-bookstore-service
on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: 도커 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: baejongto
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 도커 이미지 빌드와 푸시
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/4vidia-bookstore-service:latest .
          docker push ghcr.io/${{ github.repository_owner }}/4vidia-bookstore-service:latest
          echo "빌드완료"

      - name: 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.NEW_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NHN_PASSWORD: ${{ secrets.NHN_PASSWORD }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          ALADIN_API_KEY1: ${{ secrets.ALADIN_API_KEY1 }}
          ALADIN_API_KEY2: ${{ secrets.ALADIN_API_KEY2 }}
          ALADIN_API_KEY3: ${{ secrets.ALADIN_API_KEY3 }}
          ALADIN_API_KEY4: ${{ secrets.ALADIN_API_KEY4 }}
          ALADIN_API_KEY5: ${{ secrets.ALADIN_API_KEY5 }}
          ALADIN_API_KEY6: ${{ secrets.ALADIN_API_KEY6 }}
          ALADIN_API_KEY7: ${{ secrets.ALADIN_API_KEY7 }}
          ALADIN_API_KEY8: ${{ secrets.ALADIN_API_KEY8 }}
        with:
          host: s2.java21.net
          username: be12-team4
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 8822
          envs: GH_TOKEN,GH_OWNER,SSH_PRIVATE_KEY,ADMIN_ID,ADMIN_PASSWORD,MINIO_SECRET_KEY,REDIS_PASSWORD,MYSQL_PASSWORD,NHN_PASSWORD,MINIO_SECRET_KEY,SMTP_PASSWORD,TOSS_SECRET_KEY,GOOGLE_API_KEY,GOOGLE_API_KEY2,ALADIN_API_KEY1,ALADIN_API_KEY2,ALADIN_API_KEY3,ALADIN_API_KEY4,ALADIN_API_KEY5,ALADIN_API_KEY6,ALADIN_API_KEY7,ALADIN_API_KEY8
          script_stop: true
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u baejongto --password-stdin
            cd ~
            
            # 1번 2번 이미지 가져오기
            echo "Pulling latest images..."
            docker compose pull 4vidia-bookstore-service-1 4vidia-bookstore-service-2
            
            # 1번 서버 OUT_OF_SERVICE으로 바꿔서 접근 못하게 하고 시간 기다린후 죽음
            echo "Setting GREEN container DOWN in Eureka..."
            curl -X PUT \
            "http://${ADMIN_ID}:${ADMIN_PASSWORD}@localhost:10465/eureka/v2/apps/4VIDIA-BOOKSTORE-SERVICE/4vidia-bookstore-service-1/status?value=OUT_OF_SERVICE" || true
            sleep 30  # 게이트웨이가 명단 갱신할 시간 벌어주기
            
            # 1번 서버 다시 배포하기
            echo "Starting 4vidia-bookstore-service-1 (GREEN)..."
            docker compose up -d 4vidia-bookstore-service-1
            
            # 1번 헬스 체크를 하여 성공적으로 UP즉 배포 되었을때 2번 트래픽 로직 시작
            echo "Waiting for GREEN health check..."
            HEALTH_CHECK_COUNT=0
              while [ $HEALTH_CHECK_COUNT -lt 12 ]; do
              if curl -s http://localhost:10471/actuator/health | grep -q '"status":"UP"'; then
                echo "4vidia-bookstore-service-1 (GREEN) is UP."
                break
              fi
              echo "Health check attempt $((HEALTH_CHECK_COUNT+1)) failed. Retrying in 10s..."
              sleep 10
              HEALTH_CHECK_COUNT=$((HEALTH_CHECK_COUNT+1))
            done
            if [ $HEALTH_CHECK_COUNT -eq 12 ]; then
              echo "GREEN container failed. Aborting deployment."
              exit 1
            fi
            
            # 2번 서버 OUT_OF_SERVICE으로 바꿔서 접근 못하게 하고 시간 기다린후 죽음
            echo "Setting BLUE container DOWN in Eureka..."
            curl -X PUT \
            "http://${ADMIN_ID}:${ADMIN_PASSWORD}@localhost:10465/eureka/v2/apps/4VIDIA-BOOKSTORE-SERVICE/4vidia-bookstore-service-2/status?value=OUT_OF_SERVICE" || true
            sleep 30
            
            # 2번 서버 띄우기
            echo "Starting 4vidia-bookstore-service-2 (BLUE)..."
            docker compose up -d 4vidia-bookstore-service-2
            
            # 2번 헬스 체크를 하여 성공적으로 UP즉 배포 되었을때 이미지 정리와 성공 출력
            echo "Waiting for BLUE health check..."
            HEALTH_CHECK_COUNT=0
            while [ $HEALTH_CHECK_COUNT -lt 12 ]; do
              if curl -s http://localhost:10472/actuator/health | grep -q '"status":"UP"'; then
                echo "4vidia-bookstore-service-2 (BLUE) is UP."
                break
              fi
              echo "Health check attempt $((HEALTH_CHECK_COUNT+1)) failed. Retrying in 10s..."
              sleep 10
              HEALTH_CHECK_COUNT=$((HEALTH_CHECK_COUNT+1))
            done
            if [ $HEALTH_CHECK_COUNT -eq 12 ]; then
              echo "BLUE container failed."
              exit 1
            fi
            
            echo "Cleaning up unused Docker images..."
            docker image prune -f
            
            echo "🚀 Deployment completed successfully!"
